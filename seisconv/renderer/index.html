<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SeisConv</title>
<style>
  :root{
    --bg:#0d0f14; --panel:#141720; --panel2:#1a1e28; --border:#222838;
    --text:#c8cdd4; --dim:#7a8090; --accent:#ff8c00; --green:#00ff9f; --red:#ff3040;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:'Segoe UI',Roboto,system-ui,sans-serif;
       height:100vh;display:flex;flex-direction:column;}
  header{padding:16px 22px;border-bottom:1px solid var(--border);display:flex;align-items:baseline;gap:10px;}
  header h1{font-size:18px;letter-spacing:2px;color:var(--accent);font-weight:800;}
  header h1 span{color:var(--green);}
  header .sub{font-size:11px;color:var(--dim);letter-spacing:1px;}
  main{flex:1;overflow-y:auto;padding:22px;max-width:760px;width:100%;margin:0 auto;}
  .btn{background:var(--accent);color:#000;border:none;padding:12px 18px;font-size:14px;font-weight:700;
       border-radius:8px;cursor:pointer;letter-spacing:.5px;}
  .btn:hover{background:#ffaa22;}
  .btn:disabled{opacity:.5;cursor:not-allowed;}
  .btn.ghost{background:transparent;color:var(--green);border:1px solid var(--green);}
  .btn.ghost.sel{background:rgba(0,255,159,.12);}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:18px;margin-top:18px;}
  .card h2{font-size:13px;color:var(--accent);letter-spacing:1px;margin-bottom:12px;text-transform:uppercase;}
  .row{display:flex;justify-content:space-between;padding:7px 0;border-top:1px solid var(--border);font-size:13px;}
  .row .k{color:var(--dim);}
  .row .v{color:var(--text);font-weight:600;font-family:'Consolas',monospace;}
  .row .v.warn{color:var(--accent);}
  .label{font-size:11px;color:var(--dim);letter-spacing:1px;text-transform:uppercase;margin:18px 0 8px;}
  .chips{display:flex;gap:8px;flex-wrap:wrap;}
  .status{margin-top:16px;font-size:13px;min-height:20px;}
  .status.ok{color:var(--green);} .status.err{color:var(--red);}
  .muted{color:var(--dim);font-size:12px;margin-top:6px;}
</style>
</head>
<body>
  <header>
    <h1>SEIS<span>CONV</span></h1>
    <div class="sub">DESKTOP · SmartSeismicSystem</div>
  </header>
  <main>
    <button class="btn" id="openBtn">Open seismic file…</button>
    <p class="muted">SEG-Y · SEG-D · SEG-2 / .dat (Geode) · SU — parsed off-thread, so large files won't freeze the app.</p>

    <div class="card" id="infoCard" style="display:none;">
      <h2 id="fileName">—</h2>
      <div class="row"><span class="k">Format</span><span class="v" id="vFormat">—</span></div>
      <div class="row"><span class="k">Traces</span><span class="v" id="vTraces">—</span></div>
      <div class="row"><span class="k">Samples / trace</span><span class="v" id="vSamples">—</span></div>
      <div class="row"><span class="k">Sample interval</span><span class="v" id="vRate">—</span></div>
      <div class="row" id="warnRow" style="display:none;"><span class="k">Warnings</span><span class="v warn" id="vWarn">—</span></div>

      <div class="label">Convert to</div>
      <div class="chips" id="fmtChips">
        <button class="btn ghost sel" data-fmt="segy1">SEG-Y Rev 1</button>
        <button class="btn ghost" data-fmt="segy0">SEG-Y Rev 0</button>
        <button class="btn ghost" data-fmt="su">Seismic Unix</button>
      </div>
      <div style="margin-top:16px;">
        <button class="btn" id="convertBtn">Convert &amp; Save…</button>
      </div>
      <div class="status" id="status"></div>
    </div>
  </main>
  <script src="renderer.js"></script>
</body>
</html>
