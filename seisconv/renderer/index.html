<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SeisConv</title>
<style>
  /* SmartSeismicSystem brand palette: deep navy + teal "S" + cyan waveform */
  :root{
    --bg:#0d1f33; --panel:#142a44; --bar:#0f2438; --border:#214564;
    --text:#d6dceb; --dim:#7e93ac; --amber:#1fc8c0; --green:#34dbd0; --red:#ff5d6c; --blue:#3aa0e0;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{background:radial-gradient(1100px 520px at 50% -8%, rgba(31,200,192,0.12), transparent 60%), var(--bg);
       color:var(--text);font-family:'Segoe UI',Roboto,system-ui,sans-serif;display:flex;flex-direction:column;}
  header{display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid var(--border);
         background:rgba(15,36,56,0.70);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);}
  header .brand{font-size:17px;font-weight:800;letter-spacing:2px;color:var(--amber);}
  header .brand span{color:var(--green);}
  header .sub{font-size:10px;color:var(--dim);letter-spacing:1px;}
  header .btn{margin-left:auto;}
  .fileinfo{padding:8px 18px;border-bottom:1px solid var(--border);font-size:12px;display:flex;gap:12px;align-items:baseline;
            background:rgba(18,39,64,0.5);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);}
  .fileinfo .fi-name{color:var(--green);font-weight:700;}
  .fileinfo .fi-body{color:var(--dim);font-family:'Consolas',monospace;}
  .tabs{display:flex;border-bottom:1px solid var(--border);background:rgba(15,36,56,0.55);
        backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);}
  .tab{padding:11px 20px;background:transparent;border:none;border-bottom:2px solid transparent;color:var(--dim);
       font-size:13px;cursor:pointer;font-family:inherit;}
  .tab:hover{color:var(--text);}
  .tab.on{color:var(--amber);border-bottom-color:var(--amber);}
  main{flex:1;overflow:auto;}
  .panel{padding:20px;max-width:1000px;margin:0 auto;height:100%;}
  .btn{background:var(--amber);color:#000;border:none;padding:11px 16px;font-size:14px;font-weight:700;border-radius:8px;
       cursor:pointer;font-family:inherit;letter-spacing:.3px;}
  .btn:hover{background:#ffaa22;}
  .btn:disabled{opacity:.45;cursor:not-allowed;}
  .btn.sm{padding:7px 12px;font-size:12px;}
  .btn.ghost{background:transparent;color:var(--green);border:1px solid var(--green);}
  .btn.ghost.sel{background:rgba(0,255,159,.12);}
  .muted{color:var(--dim);font-size:12px;margin-top:8px;}
  .label{font-size:11px;color:var(--dim);letter-spacing:1px;text-transform:uppercase;margin:18px 0 8px;}
  .chips{display:flex;gap:8px;flex-wrap:wrap;}
  .status{margin-top:14px;font-size:13px;min-height:18px;}
  .status.ok{color:var(--green);} .status.err{color:var(--red);}
  .trace-bar{display:flex;align-items:center;gap:12px;margin-bottom:12px;}
  .trace-bar .slider{flex:1;}
  .trace-label{font-size:12px;color:var(--dim);font-family:'Consolas',monospace;white-space:nowrap;}
  .canvas{display:block;width:100%;height:60vh;background:var(--bg);border:1px solid var(--border);border-radius:8px;
          box-shadow:0 10px 30px rgba(0,0,0,0.35), inset 0 0 0 1px rgba(52,219,208,0.06);}
  .slider{accent-color:var(--amber);}
  .sec-bar{display:flex;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap;}
  .ctl{background:rgba(20,42,68,0.6);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:6px 8px;font-family:inherit;font-size:12px;}
  .ctl-lbl{font-size:12px;color:var(--dim);display:flex;align-items:center;gap:6px;}
  .slider.sm{width:90px;}
  .numin{width:56px;background:rgba(20,42,68,0.6);color:var(--text);border:1px solid var(--border);border-radius:5px;padding:4px 6px;font-family:inherit;font-size:12px;}
  .qc-results{margin-top:12px;max-height:34vh;overflow:auto;font-size:12px;}
  .qc-hdr{color:var(--dim);padding:4px 0;border-bottom:1px solid var(--border);margin-bottom:6px;}
  .qc-row{display:grid;grid-template-columns:60px 92px 1fr;gap:8px;padding:4px 0;border-bottom:1px solid rgba(33,69,100,0.4);}
  .qc-row .qc-sev{font-weight:700;}
  .qc-row.error .qc-sev{color:var(--red);}
  .qc-row.warn .qc-sev{color:var(--amber);}
  .qc-row.ok .qc-sev{color:var(--green);}
  .qc-cat{color:var(--dim);}
</style>
</head>
<body>
  <header>
    <div class="brand">SEIS<span>CONV</span></div>
    <div class="sub">DESKTOP · SmartSeismicSystem</div>
    <button class="btn sm" id="openBtn">Open file…</button>
  </header>

  <div class="fileinfo" id="fileInfo" style="display:none;">
    <span class="fi-name" id="fiName">—</span>
    <span class="fi-body" id="fiBody"></span>
  </div>

  <nav class="tabs">
    <button class="tab on" id="tab-conv">Converter</button>
    <button class="tab" id="tab-trace">Trace Inspector</button>
    <button class="tab" id="tab-section">File Viewer</button>
    <button class="tab" id="tab-sps">SPS 2.1</button>
    <button class="tab" id="tab-vel">Velocity</button>
  </nav>

  <main>
    <section class="panel" id="panel-conv">
      <button class="btn" id="openBtn2">Open seismic file…</button>
      <p class="muted">SEG-Y · SEG-D · SEG-2 / .dat (Geode) · SU — parsed off the UI thread, so big files stay responsive.</p>
      <div class="label">Convert to</div>
      <div class="chips" id="fmtChips">
        <button class="btn ghost sel" data-fmt="segy1">SEG-Y Rev 1</button>
        <button class="btn ghost" data-fmt="segy0">SEG-Y Rev 0</button>
        <button class="btn ghost" data-fmt="su">Seismic Unix</button>
      </div>
      <button class="btn" id="convertBtn" disabled style="margin-top:14px;">Convert &amp; Save…</button>
      <div class="status" id="convStatus"></div>
      <div class="label">Batch</div>
      <button class="btn sm" id="batchBtn">Convert multiple files → ZIP…</button>
      <div id="batchResults" class="qc-results"></div>
    </section>

    <section class="panel" id="panel-trace" style="display:none;">
      <div class="trace-bar">
        <button class="btn sm" id="tracePrev">‹ Prev</button>
        <input type="range" id="traceSlider" class="slider" min="0" max="0" value="0">
        <button class="btn sm" id="traceNext">Next ›</button>
        <span class="trace-label" id="traceLabel">Open a file to inspect traces</span>
      </div>
      <canvas id="traceCanvas" class="canvas"></canvas>
    </section>

    <section class="panel" id="panel-section" style="display:none;">
      <div class="sec-bar">
        <select id="secMode" class="ctl">
          <option value="vd">Variable Density</option>
          <option value="wiggle">Wiggle</option>
          <option value="va">Variable Area</option>
          <option value="vdwig">VD + Wiggle</option>
        </select>
        <select id="secColor" class="ctl">
          <option value="seismic">Seismic</option>
          <option value="gray">Gray</option>
          <option value="amber">Amber</option>
          <option value="viridis">Viridis</option>
        </select>
        <label class="ctl-lbl">Gain <input type="range" id="secGain" class="slider sm" min="0.2" max="6" step="0.1" value="1"></label>
        <label class="ctl-lbl"><input type="checkbox" id="secAgc"> AGC</label>
        <span class="trace-label" id="secLabel">Open a file to view the section</span>
      </div>
      <canvas id="secCanvas" class="canvas"></canvas>
    </section>

    <section class="panel" id="panel-sps" style="display:none;">
      <div class="sec-bar">
        <button class="btn sm" id="spsLoadBtn">Load SPS files (S / R / X)…</button>
        <label class="ctl-lbl"><input type="checkbox" id="spsShowS" checked> Sources</label>
        <label class="ctl-lbl"><input type="checkbox" id="spsShowR" checked> Receivers</label>
        <label class="ctl-lbl"><input type="checkbox" id="spsGeo"> Geographic (WGS84)</label>
        <span class="trace-label" id="spsLabel">Load S/R/X files to plot the survey</span>
      </div>
      <canvas id="spsCanvas" class="canvas"></canvas>
      <div class="sec-bar" style="margin-top:12px;">
        <button class="btn sm" id="spsQcBtn">Run QC</button>
        <label class="ctl-lbl">Src int <input type="number" id="qcSrcInt" class="numin" value="0"></label>
        <label class="ctl-lbl">Rcv int <input type="number" id="qcRcvInt" class="numin" value="0"></label>
        <label class="ctl-lbl">Tol <input type="number" id="qcTol" class="numin" value="1"></label>
        <label class="ctl-lbl">Max off <input type="number" id="qcMaxOff" class="numin" value="0"></label>
      </div>
      <div id="qcResults" class="qc-results"></div>
      <div class="sec-bar" style="margin-top:10px;">
        <span class="ctl-lbl">Reproject to</span>
        <select id="epsgSelect" class="ctl"></select>
        <button class="btn sm" id="spsExportBtn">Export reprojected (ZIP)…</button>
        <span class="trace-label" id="spsExportStatus"></span>
      </div>
    </section>

    <section class="panel" id="panel-vel" style="display:none;">
      <div class="sec-bar">
        <label class="ctl-lbl">Vmin <input type="number" id="velMin" class="numin" value="1000"></label>
        <label class="ctl-lbl">Vmax <input type="number" id="velMax" class="numin" value="5000"></label>
        <label class="ctl-lbl">Step <input type="number" id="velStep" class="numin" value="50"></label>
        <button class="btn sm" id="velComputeBtn">Compute semblance</button>
        <button class="btn sm" id="velExportBtn">Export picks CSV…</button>
        <span class="trace-label" id="velLabel">Open a file, then compute</span>
      </div>
      <canvas id="velCanvas" class="canvas"></canvas>
      <div id="velPicks" class="qc-results"></div>
    </section>
  </main>

  <script src="./dist/app.js"></script>
</body>
</html>
